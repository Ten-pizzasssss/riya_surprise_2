<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catch the Hearts - Surprise for Riya</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent accidental scrolling */
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #ffc3a0, #ffafbd);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            touch-action: none; /* Crucial for mobile drag games */
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-container {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            overflow: hidden; 
            z-index: 1; /* Keep it below the canvas (z-index 10) */
            pointer-events: none;
        }
        
        .orb {
            position: absolute; 
            border-radius: 50%; 
            filter: blur(80px); 
            opacity: 0.8;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }
        .orb1 { width: 350px; height: 350px; background: #ff4081; top: -50px; left: -50px; }
        .orb2 { width: 450px; height: 450px; background: #ff80ab; bottom: -100px; right: -50px; animation-delay: -3s; }
        .orb3 { width: 300px; height: 300px; background: #ff6e40; top: 40%; left: 30%; animation-delay: -6s; }
        
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 60px) scale(1.3); }
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            background: transparent;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background: rgba(255, 255, 255, 0.3); /* Slightly more transparent for the background */
            backdrop-filter: blur(5px);
            transition: opacity 0.5s ease;
        }

        #score-display {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #d81b60;
            z-index: 15;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
        }

        .btn-start {
            background: linear-gradient(45deg, #ff4081, #f50057);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            box-shadow: 0 10px 20px rgba(245, 0, 87, 0.3);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 30; /* Ensure button is clickable above everything */
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        #victory-screen {
            display: none;
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.7);
        }

        .romantic-text {
            font-family: 'Dancing Script', cursive;
            line-height: 1.3;
            color: #c2185b;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.9);
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
            padding: 0 20px;
        }

        .stage-1-text {
            font-size: 3.5rem;
        }

        .stage-2-text {
            font-size: 4.5rem;
            background: linear-gradient(45deg, #d81b60, #ff4081);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: scale(1.1); }
        }
    </style>
</head>
<body>

    
    <!-- Romantic audio tune (hidden) -->
    <audio id="bg-music" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-acoustic-guitar-230.mp3" type="audio/mpeg">
    </audio>

    <!-- Background Elements -->
    <div class="bg-container">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <!-- Score Display -->
    <div id="score-display" style="display: none;">Hearts: <span id="score-val">0</span> / 7</div>

    <!-- The Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Start Screen Overlay -->
    <div id="start-screen" class="overlay">
        <h1 class="text-3xl font-bold text-pink-600 mb-2 font-[Poppins]">Catch the Hearts!</h1>
        <p class="text-pink-500 mb-8 text-center px-6 font-[Poppins]">Help Riya catch 7 hearts!</p>
        <button class="btn-start font-[Poppins]" id="start-btn">Play Now</button>
    </div>

    <!-- Victory Screen Overlay (2 Stages) -->
    <div id="victory-screen" class="overlay">
        <div id="victory-stage-1" class="romantic-text stage-1-text" style="display: none;">
            You caught my heart Riya ❤️
        </div>
        <div id="victory-stage-2" class="romantic-text stage-2-text" style="display: none;">
            Happiest Birthday<br>Riya!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const victoryScreen = document.getElementById('victory-screen');
        const stage1Text = document.getElementById('victory-stage-1');
        const stage2Text = document.getElementById('victory-stage-2');
        const scoreDisplay = document.getElementById('score-display');
        const scoreVal = document.getElementById('score-val');
        const startBtn = document.getElementById('start-btn');
        const bgMusic = document.getElementById('bg-music');

        // Game Configuration
        const TARGET_SCORE = 7;
        let score = 0;
        let gameState = 'start'; // 'start', 'playing', 'won'
        let hearts = [];
        let animationId;
        let lastTime = 0;
        let heartSpawnTimer = 0;

        const player = {
            x: 0,
            y: 0,
            width: 80,
            height: 100, // Taller to fit emoji + text
            emoji: '💃',
            name: 'Riya',
            updatePosition(clientX) {
                const rect = canvas.getBoundingClientRect();
                let newX = clientX - rect.left;
                // Keep player within screen bounds
                this.x = Math.max(this.width / 2, Math.min(canvas.width - this.width / 2, newX));
            },
            draw() {
                // Draw the full-body emoji
                ctx.font = `65px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y - 15);
                
                // Draw her name underneath
                ctx.font = `bold 22px Poppins`;
                ctx.fillStyle = '#d81b60';
                ctx.shadowColor = 'rgba(255,255,255,0.8)';
                ctx.shadowBlur = 4;
                ctx.fillText(this.name, this.x, this.y + 40);
                ctx.shadowColor = 'transparent'; // reset
            }
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Place player at the bottom center initially
            if (gameState === 'start') {
                player.x = canvas.width / 2;
            }
            player.y = canvas.height - player.height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Heart {
            constructor() {
                this.x = Math.random() * (canvas.width - 40) + 20;
                this.y = -30; // Start slightly above screen
                this.size = Math.random() * 15 + 25; // Random size between 25-40
                this.speed = Math.random() * 2 + 2.5; // Fall speed
                this.emojis = ['❤️', '💖', '💘', '💕', '💗'];
                this.emoji = this.emojis[Math.floor(Math.random() * this.emojis.length)];
                
                // Add a slight wobble effect
                this.wobbleSpeed = Math.random() * 0.05 + 0.02;
                this.wobbleOffset = Math.random() * Math.PI * 2;
                this.baseX = this.x;
            }

            update() {
                this.y += this.speed;
                // Sine wave wobble for natural falling motion
                this.x = this.baseX + Math.sin(this.y * this.wobbleSpeed + this.wobbleOffset) * 15;
            }

            draw() {
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y);
            }
        }

        function gameLoop(timestamp) {
            if (gameState !== 'playing') return;

            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            // Clear canvas for next frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Spawn new hearts periodically
            heartSpawnTimer += deltaTime;
            if (heartSpawnTimer > 700) { // Spawn slightly slower to make it easy
                hearts.push(new Heart());
                heartSpawnTimer = 0;
            }

            // Update and draw hearts
            for (let i = hearts.length - 1; i >= 0; i--) {
                const heart = hearts[i];
                heart.update();
                heart.draw();

                // Check Collision with player (Riya)
                const distX = heart.x - player.x;
                const distY = heart.y - player.y;
                const distance = Math.sqrt(distX * distX + distY * distY);

                if (distance < (player.width / 2 + heart.size / 2)) {
                    // Caught the heart!
                    hearts.splice(i, 1);
                    score++;
                    scoreVal.innerText = score;
                    
                    // Pop animation on score text
                    scoreDisplay.style.transform = 'scale(1.3)';
                    setTimeout(() => scoreDisplay.style.transform = 'scale(1)', 150);

                    // Check Win Condition
                    if (score >= TARGET_SCORE) {
                        triggerVictory();
                        return; // Stop current loop frame
                    }
                } 
                // Remove hearts that fall off screen to save memory
                else if (heart.y > canvas.height + 50) {
                    hearts.splice(i, 1);
                }
            }

            // Draw the player
            player.draw();

            // Request next frame
            animationId = requestAnimationFrame(gameLoop);
        }

        function triggerVictory() {
            gameState = 'won';
            cancelAnimationFrame(animationId);
            
            // Clear canvas gracefully
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            scoreDisplay.style.display = 'none';
            
            // Show Victory Screen Stage 1
            victoryScreen.style.display = 'flex';
            stage1Text.style.display = 'block';
            
            // Wait exactly 3 seconds, then transition to Stage 2
            setTimeout(() => {
                // Fade out stage 1
                stage1Text.style.animation = 'fadeOut 1s forwards';
                
                setTimeout(() => {
                    // Hide stage 1, show stage 2 and confetti
                    stage1Text.style.display = 'none';
                    stage2Text.style.display = 'block';
                    shootConfetti();
                }, 1000); // Wait for fade out to finish
                
            }, 3000);
        }

        function shootConfetti() {
            const duration = 15000; // Keep shooting for a long time
            const end = Date.now() + duration;

            // Fire every 250ms for a continuous explosion (Mobile optimized)
            const interval = setInterval(function() {
                if (Date.now() > end) {
                    return clearInterval(interval);
                }
                confetti({
                    particleCount: 15,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0, y: 1 },
                    colors: ['#ffb6c1', '#ff1493', '#ff69b4', '#ffffff', '#c2185b'],
                    zIndex: 100
                });
                confetti({
                    particleCount: 15,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1, y: 1 },
                    colors: ['#ffb6c1', '#ff1493', '#ff69b4', '#ffffff', '#c2185b'],
                    zIndex: 100
                });
            }, 250);
        }

        // Mouse Controls
        canvas.addEventListener('mousemove', (e) => {
            if (gameState === 'playing') {
                player.updatePosition(e.clientX);
            }
        });

        // Touch Controls (Mobile Friendly)
        canvas.addEventListener('touchstart', (e) => {
            if (gameState === 'playing') {
                player.updatePosition(e.touches[0].clientX);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (gameState === 'playing') {
                e.preventDefault(); // Prevents screen from scrolling while dragging
                player.updatePosition(e.touches[0].clientX);
            }
        }, { passive: false });

        // Start game & Audio Playback
        startBtn.addEventListener('click', () => {
            // Browsers block autoplay until the user interacts. The start button click acts as the interaction.
            bgMusic.play().catch(error => {
                console.log("Audio playback failed: ", error);
            });
            
            gameState = 'playing';
            score = 0;
            scoreVal.innerText = score;
            hearts = [];
            
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                scoreDisplay.style.display = 'block';
                
                // Initialize game clock and start loop
                lastTime = performance.now();
                animationId = requestAnimationFrame(gameLoop);
            }, 500);
        });

    </script>
</body>
</html>
