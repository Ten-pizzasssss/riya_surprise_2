<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Catch the Hearts - Surprise for Riya</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #ffc3a0, #ffafbd);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- Background (GPU-friendly: only transforms animate) ---------- */
        .bg-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
            contain: strict;
        }

        /* Replaces the animated background-position gradient, which repainted every frame */
        .bg-gradient {
            position: absolute;
            top: 0; left: 0;
            width: 200%; height: 100%;
            background: linear-gradient(90deg, #ff9a9e, #fecfef, #ffc3a0, #ffafbd, #ff9a9e);
            will-change: transform;
            animation: gradientMove 10s ease-in-out infinite alternate;
        }
        @keyframes gradientMove {
            from { transform: translate3d(0, 0, 0); }
            to   { transform: translate3d(-50%, 0, 0); }
        }

        /* Soft radial gradients instead of filter: blur(80px) */
        .orb {
            position: absolute;
            border-radius: 50%;
            will-change: transform;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }
        .orb1 {
            width: 500px; height: 500px; top: -150px; left: -150px;
            background: radial-gradient(circle, rgba(255,64,129,.8) 0%, rgba(255,64,129,0) 65%);
        }
        .orb2 {
            width: 650px; height: 650px; bottom: -250px; right: -200px;
            background: radial-gradient(circle, rgba(255,128,171,.85) 0%, rgba(255,128,171,0) 65%);
            animation-delay: -3s;
        }
        .orb3 {
            width: 450px; height: 450px; top: 35%; left: 20%;
            background: radial-gradient(circle, rgba(255,110,64,.7) 0%, rgba(255,110,64,0) 65%);
            animation-delay: -6s;
        }
        @keyframes floatOrb {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(60px, 60px, 0) scale(1.3); }
        }

        /* ---------- Game ---------- */
        #game-canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            background: transparent;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            /* backdrop-filter removed: it re-blurs the animated background every frame */
            background: rgba(255, 255, 255, 0.4);
            transition: opacity 0.5s ease;
        }

        .start-title {
            margin: 0 0 8px;
            font-size: 1.875rem;
            font-weight: 700;
            color: #db2777;
        }
        .start-sub {
            margin: 0 0 32px;
            padding: 0 24px;
            text-align: center;
            color: #ec4899;
        }

        #score-display {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top, 0px));
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #d81b60;
            z-index: 15;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
            transition: transform 0.15s ease;
        }

        .btn-start {
            font-family: inherit;
            background: linear-gradient(45deg, #ff4081, #f50057);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            box-shadow: 0 10px 20px rgba(245, 0, 87, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 30;
        }
        .btn-start:active { transform: scale(0.95); }

        #victory-screen {
            display: none;
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.7);
        }

        .romantic-text {
            font-family: 'Dancing Script', cursive;
            line-height: 1.3;
            color: #c2185b;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.9);
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
            padding: 0 20px;
        }
        .stage-1-text { font-size: clamp(2.2rem, 11vw, 3.5rem); }
        .stage-2-text {
            font-size: clamp(2.8rem, 14vw, 4.5rem);
            background: linear-gradient(45deg, #d81b60, #ff4081);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes popIn  { to { opacity: 1; transform: scale(1); } }
        @keyframes fadeOut { to { opacity: 0; transform: scale(1.1); } }

        @media (prefers-reduced-motion: reduce) {
            .bg-gradient, .orb { animation: none; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-acoustic-guitar-230.mp3" type="audio/mpeg">
    </audio>

    <div class="bg-container" aria-hidden="true">
        <div class="bg-gradient"></div>
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div id="score-display" style="display: none;">Hearts: <span id="score-val">0</span> / 7</div>

    <canvas id="game-canvas"></canvas>

    <div id="start-screen" class="overlay">
        <h1 class="start-title">Catch the Hearts!</h1>
        <p class="start-sub">Help Riya catch 7 hearts!</p>
        <button class="btn-start" id="start-btn">Play Now</button>
    </div>

    <div id="victory-screen" class="overlay">
        <div id="victory-stage-1" class="romantic-text stage-1-text" style="display: none;">
            You caught my heart Riya ❤️
        </div>
        <div id="victory-stage-2" class="romantic-text stage-2-text" style="display: none;">
            Happiest Birthday<br>Riya!
        </div>
    </div>

    <script>
    (() => {
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const victoryScreen = document.getElementById('victory-screen');
        const stage1Text = document.getElementById('victory-stage-1');
        const stage2Text = document.getElementById('victory-stage-2');
        const scoreDisplay = document.getElementById('score-display');
        const scoreVal = document.getElementById('score-val');
        const startBtn = document.getElementById('start-btn');
        const bgMusic = document.getElementById('bg-music');

        const isMobile = matchMedia('(pointer: coarse)').matches || innerWidth < 700;
        const maxDpr = isMobile ? 1.5 : 2;

        // Game config
        const TARGET_SCORE = 7;
        const SPAWN_MS = 700;
        const EMOJIS = ['❤️', '💖', '💘', '💕', '💗'];
        const HEART_SPR = 40;     // sprite size in CSS px
        const SPR_SCALE = 1.25;   // sprite draw scale to match the old text-based size

        let score = 0;
        let gameState = 'start';  // 'start' | 'playing' | 'won'
        let hearts = [];
        let animationId = 0;
        let lastTime = 0;
        let spawnTimer = 0;

        let dpr = 1, W = 0, H = 0, spriteDpr = 0;
        let heartSprites = [];
        let playerSprite = null;
        let targetX = 0;

        const player = { x: 0, y: 0, width: 80, height: 100 };

        /* ---------- Sprites: emoji/text rendered once, then blitted ---------- */
        function buildSprites() {
            if (spriteDpr === dpr && heartSprites.length) return;
            spriteDpr = dpr;

            heartSprites = EMOJIS.map(e => {
                const s = document.createElement('canvas');
                s.width = s.height = Math.ceil(HEART_SPR * dpr);
                const c = s.getContext('2d');
                c.scale(dpr, dpr);
                c.font = '32px sans-serif';
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText(e, HEART_SPR / 2, HEART_SPR / 2);
                return s;
            });

            // Player + name in one sprite (the shadowBlur is also paid for only once)
            const PW = 140, PH = 125;
            playerSprite = document.createElement('canvas');
            playerSprite.width = Math.ceil(PW * dpr);
            playerSprite.height = Math.ceil(PH * dpr);
            const p = playerSprite.getContext('2d');
            p.scale(dpr, dpr);
            p.textAlign = 'center';
            p.textBaseline = 'middle';
            p.font = '65px sans-serif';
            p.fillText('💃', PW / 2, 50);
            p.font = 'bold 22px Poppins, sans-serif';
            p.fillStyle = '#d81b60';
            p.shadowColor = 'rgba(255,255,255,0.8)';
            p.shadowBlur = 4;
            p.fillText('Riya', PW / 2, 105);
            playerSprite._w = PW;
            playerSprite._h = PH;
        }

        /* ---------- Sizing ---------- */
        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            player.y = H - player.height;
            if (gameState === 'start') targetX = W / 2;
            player.x = Math.max(player.width / 2, Math.min(W - player.width / 2, targetX || W / 2));
            buildSprites();
        }

        let resizeRaf = 0;
        window.addEventListener('resize', () => {
            cancelAnimationFrame(resizeRaf);
            resizeRaf = requestAnimationFrame(resizeCanvas);
        });
        resizeCanvas();

        // Rebuild sprites once web fonts are ready so the name renders in Poppins
        if (document.fonts && document.fonts.load) {
            document.fonts.load('bold 22px Poppins').then(() => { spriteDpr = 0; buildSprites(); });
        }

        /* ---------- Hearts ---------- */
        function spawnHeart() {
            const x = Math.random() * (W - 40) + 20;
            hearts.push({
                x, baseX: x,
                y: -30,
                size: Math.random() * 15 + 25,
                speed: (Math.random() * 2 + 2.5) * 60,        // px per second (frame-rate independent)
                sprite: heartSprites[(Math.random() * heartSprites.length) | 0],
                wobbleSpeed: Math.random() * 0.05 + 0.02,
                wobbleOffset: Math.random() * Math.PI * 2
            });
        }

        /* ---------- Game loop ---------- */
        function gameLoop(timestamp) {
            if (gameState !== 'playing') return;

            // Clamp dt so returning from a background tab doesn't cause a jump
            const dt = Math.min(timestamp - lastTime, 50);
            lastTime = timestamp;
            const sec = dt / 1000;

            ctx.clearRect(0, 0, W, H);

            // Apply the latest pointer position (batched to one update per frame)
            player.x = Math.max(player.width / 2, Math.min(W - player.width / 2, targetX));

            spawnTimer += dt;
            if (spawnTimer >= SPAWN_MS) {
                spawnTimer -= SPAWN_MS;
                spawnHeart();
            }

            for (let i = hearts.length - 1; i >= 0; i--) {
                const h = hearts[i];
                h.y += h.speed * sec;
                h.x = h.baseX + Math.sin(h.y * h.wobbleSpeed + h.wobbleOffset) * 15;

                const dx = h.x - player.x;
                const dy = h.y - player.y;
                const hitR = player.width / 2 + h.size / 2;

                if (dx * dx + dy * dy < hitR * hitR) {
                    hearts[i] = hearts[hearts.length - 1];
                    hearts.pop();
                    score++;
                    scoreVal.textContent = score;

                    scoreDisplay.style.transform = 'scale(1.3)';
                    setTimeout(() => { scoreDisplay.style.transform = 'scale(1)'; }, 150);

                    if (score >= TARGET_SCORE) {
                        triggerVictory();
                        return;
                    }
                } else if (h.y > H + 50) {
                    hearts[i] = hearts[hearts.length - 1];
                    hearts.pop();
                } else {
                    const d = h.size * SPR_SCALE;
                    ctx.drawImage(h.sprite, h.x - d / 2, h.y - d / 2, d, d);
                }
            }

            // Player sprite: emoji centre sits at (x, y - 15), same as before
            ctx.drawImage(playerSprite, player.x - playerSprite._w / 2, player.y - 65,
                          playerSprite._w, playerSprite._h);

            animationId = requestAnimationFrame(gameLoop);
        }

        /* ---------- Victory ---------- */
        function triggerVictory() {
            gameState = 'won';
            cancelAnimationFrame(animationId);
            hearts.length = 0;
            ctx.clearRect(0, 0, W, H);
            scoreDisplay.style.display = 'none';

            victoryScreen.style.display = 'flex';
            stage1Text.style.display = 'block';

            setTimeout(() => {
                stage1Text.style.animation = 'fadeOut 1s forwards';
                setTimeout(() => {
                    stage1Text.style.display = 'none';
                    stage2Text.style.display = 'block';
                    shootConfetti();
                }, 1000);
            }, 3000);
        }

        function shootConfetti() {
            // Own canvas, drawn off the main thread where supported
            const cc = document.createElement('canvas');
            cc.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100;';
            document.body.appendChild(cc);

            const shoot = confetti.create(cc, {
                resize: true,
                useWorker: true,
                disableForReducedMotion: true
            });

            const colors = ['#ffb6c1', '#ff1493', '#ff69b4', '#ffffff', '#c2185b'];
            const count = isMobile ? 8 : 15;
            const ticks = isMobile ? 140 : 200;
            const end = Date.now() + 15000;

            function burst() {
                shoot({ particleCount: count, angle: 60,  spread: 60, origin: { x: 0, y: 1 }, colors, ticks, zIndex: 100 });
                shoot({ particleCount: count, angle: 120, spread: 60, origin: { x: 1, y: 1 }, colors, ticks, zIndex: 100 });
            }

            burst();
            const interval = setInterval(() => {
                if (Date.now() > end) {
                    clearInterval(interval);
                    setTimeout(() => { if (shoot.reset) shoot.reset(); cc.remove(); }, 4000);
                    return;
                }
                burst();
            }, isMobile ? 300 : 250);
        }

        /* ---------- Input (pointer events cover mouse + touch) ---------- */
        canvas.addEventListener('pointerdown', e => { if (gameState === 'playing') targetX = e.clientX; });
        canvas.addEventListener('pointermove', e => { if (gameState === 'playing') targetX = e.clientX; });

        /* ---------- Start ---------- */
        startBtn.addEventListener('click', () => {
            bgMusic.play().catch(err => console.log('Audio playback failed: ', err));

            gameState = 'playing';
            score = 0;
            scoreVal.textContent = score;
            hearts = [];
            spawnTimer = 0;
            targetX = W / 2;

            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                scoreDisplay.style.display = 'block';
                lastTime = performance.now();
                animationId = requestAnimationFrame(gameLoop);
            }, 500);
        });
    })();
    </script>
</body>
</html>
